# Local stack: PostgreSQL + the app. Seed once with:
#   docker compose run --rm seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: arivupulla
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d arivupulla"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/arivupulla?schema=public
      APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  seed:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/arivupulla?schema=public
    command: sh -c "apt-get update -qq && apt-get install -y -qq openssl >/dev/null && npm ci && npx prisma migrate deploy && npm run db:seed"
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

volumes:
  pgdata:
